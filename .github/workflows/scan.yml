name: Scan flight deals

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      seed:
        description: "Seed price history before scanning"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "scanner/**"
      - "site/**"
      - "tests/**"
      - ".github/workflows/scan.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Python tests
        run: python -m pytest -q

      - name: JavaScript tests
        run: node --test "tests/js/*.test.js"

      - name: Seed history
        if: ${{ inputs.seed }}
        run: python -m scanner --seed
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}

      - name: Scan
        run: python -m scanner
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site/deals.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "scan: $(date -u +%F)"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
